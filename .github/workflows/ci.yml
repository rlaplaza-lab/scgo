name: CI

# Marker contract (pytest -m): per-suite fast/slow expressions live in the
# matrix `include` block below (fast_marker / slow_marker). Each MLIP suite
# excludes the other two `requires_*` markers; `benchmark` and `requires_cuda`
# are never run on these CPU runners (GPU: kaggle-gpu.yml).
#
# PR: mace 3.13 fast+slow, uma/upet 3.13 fast-only (unique coverage, less wall-clock).
# main push / nightly / workflow_dispatch: full 3 suites x 2 Pythons, fast+slow.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly full matrix (UTC).
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and doc dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r docs/source/requirements.txt

      - name: Build HTML documentation
        run: |
          cd docs && make html SPHINXOPTS='-W'

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff check
        run: |
          ruff check .

      - name: Run ruff format (check only)
        run: |
          ruff format --check .

  matrix-prep:
    name: Select test matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - name: Choose PR vs full matrix
        id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          # Marker source of truth: each suite's fast/slow expression.
          # CUDA tests are deselected (not collected-then-skipped).
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event = os.environ["EVENT_NAME"]
          ref = os.environ["GIT_REF"]
          full = event in ("schedule", "workflow_dispatch") or (
              event == "push" and ref == "refs/heads/main"
          )

          def cell(py, suite, extras, peers, run_slow):
              excl = " and ".join(f"not requires_{p}" for p in peers)
              # Use string flags: fromJson boolean quirks can make `if:` unreliable.
              return {
                  "python-version": py,
                  "pip-extras": extras,
                  "suite": suite,
                  "run_slow": "true" if run_slow else "false",
                  "label": "slow" if run_slow else "fast-only",
                  "fast_marker": (
                      f"not slow and not integration and not requires_cuda and {excl}"
                  ),
                  "slow_marker": (
                      f"slow and not benchmark and not requires_cuda and {excl}"
                  ),
              }

          suites = [
              ("mace", "mace,dev", ("upet", "uma")),
              ("uma", "uma,dev", ("mace", "upet")),
              ("upet", "upet,dev", ("mace", "uma")),
          ]
          if full:
              include = [
                  cell(py, suite, extras, peers, True)
                  for py in ("3.12", "3.13")
                  for suite, extras, peers in suites
              ]
          else:
              # PR: unique coverage — mace 3.13 fast+slow; uma/upet 3.13 fast-only.
              include = [
                  cell("3.13", "mace", "mace,dev", ("upet", "uma"), True),
                  cell("3.13", "uma", "uma,dev", ("mace", "upet"), False),
                  cell("3.13", "upet", "upet,dev", ("mace", "uma"), False),
              ]
          print(f"Selected {'full' if full else 'PR'} matrix ({len(include)} cells)")
          Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write(
              "include=" + json.dumps(include) + "\n"
          )
          PY

  test:
    name: Test (${{ matrix.suite }}, Python ${{ matrix.python-version }}, ${{ matrix.label }})
    needs: matrix-prep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix-prep.outputs.include) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force || true
          df -h

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.suite }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.suite }}-
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.pip-extras }}]"
          # metatomic-torchsim declares vesin<0.6 but needs NeighborList(skin=...) from 0.6.0
          if [ "${{ matrix.suite }}" = "upet" ]; then
            pip install 'vesin==0.6.0' --force-reinstall --no-deps
          fi

      - name: Check SQLite JSON1 extension
        run: |
          python - <<'PY'
          import sqlite3, sys
          conn = sqlite3.connect(":memory:")
          try:
              cur = conn.cursor()
              cur.execute("SELECT json_extract('{\"a\": 42}', '$.a')")
              res = cur.fetchone()
              if res is None or res[0] != 42:
                  print("SQLite JSON1 returned unexpected result:", res)
                  sys.exit(1)
          except sqlite3.OperationalError as e:
              print("SQLite JSON1 extension required but not available:", e)
              sys.exit(1)
          finally:
              conn.close()
          PY

      - name: Run fast tests
        run: |
          pytest tests/ -n 2 --timeout=300 -m "${{ matrix.fast_marker }}" -v --cov=scgo --cov-report=xml --cov-report=term

      - name: Run slow tests
        if: matrix.run_slow == 'true'
        env:
          SCGO_BATCH_TEST_SAMPLES: "15"
        run: |
          pytest tests/ -m "${{ matrix.slow_marker }}" -n 2 --timeout=600 -v --cov=scgo --cov-report=xml --cov-report=term --cov-append

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.suite == 'mace' && matrix.python-version == '3.13'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
