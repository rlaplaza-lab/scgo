name: Modal GPU tests

# Full CUDA suites on Modal H100 (see tests/README.md). Weekly smoke stays on
# Kaggle (kaggle-gpu.yml). MACE and UPET run in separate containers (mutually
# exclusive extras). UMA is omitted: HuggingFace auth for fairchem weights is
# not available here.
#
# mode=full (default / monthly cron): entire requires_cuda suite per MLIP.
# mode=smoke: short gpu_smoke markers (manual only; prefer Kaggle for weekly).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to checkout and test on Modal
        required: false
        default: main
        type: string
      mode:
        description: >
          full = entire CUDA suite (default / monthly); smoke = short GPU
          smoke. Prefer full unless iterating cheaply on Modal credits.
        required: false
        default: full
        type: choice
        options:
          - full
          - smoke
      marker:
        description: >
          Optional pytest marker override for both suites. Leave empty to use
          suite defaults for the selected mode. Always excludes benchmark.
        required: false
        default: ""
        type: string
  schedule:
    # Monthly full suite (UTC 1st of month). Smoke stays on Kaggle weekly.
    - cron: "0 6 1 * *"

concurrency:
  group: modal-gpu-${{ github.workflow }}-${{ github.event.inputs.ref || github.ref }}-${{ github.event.inputs.mode || 'full' }}
  cancel-in-progress: true

jobs:
  modal-gpu:
    name: Modal H100 (${{ matrix.suite }}, ${{ github.event.inputs.mode || 'full' }}, ${{ github.event.inputs.ref || 'main' }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: mace
            mlip_extra: mace
            smoke_marker: gpu_smoke and requires_mace and not benchmark
            full_marker: requires_cuda and requires_mace and not benchmark
          - suite: upet
            mlip_extra: upet
            smoke_marker: gpu_smoke and requires_upet and not benchmark
            full_marker: requires_cuda and requires_upet and not benchmark
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_API_TOKEN }}
    steps:
      - name: Resolve mode and ref
        id: cfg
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_MARKER: ${{ github.event.inputs.marker }}
          SMOKE_MARKER: ${{ matrix.smoke_marker }}
          FULL_MARKER: ${{ matrix.full_marker }}
        run: |
          REF="${INPUT_REF:-main}"
          MODE="${INPUT_MODE:-full}"
          if [ -n "${INPUT_MARKER}" ]; then
            MARKER="${INPUT_MARKER}"
          elif [ "${MODE}" = "smoke" ]; then
            MARKER="${SMOKE_MARKER}"
          else
            MARKER="${FULL_MARKER}"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "marker=${MARKER}" >> "$GITHUB_OUTPUT"
          echo "Resolved ref=${REF} mode=${MODE} marker=${MARKER}"

      - name: Check Modal secrets
        run: |
          # Trim whitespace/newlines from pasted secrets, then re-export.
          TOKEN_ID="$(printf '%s' "${MODAL_TOKEN_ID}" | tr -d '[:space:]')"
          TOKEN_SECRET="$(printf '%s' "${MODAL_TOKEN_SECRET}" | tr -d '[:space:]')"
          if [ -z "${TOKEN_ID}" ]; then
            echo "Missing repo secret MODAL_TOKEN_ID (Modal token id, e.g. ak-...)"
            exit 1
          fi
          if [ -z "${TOKEN_SECRET}" ]; then
            echo "Missing repo secret MODAL_API_TOKEN (Modal token secret, e.g. as-...)"
            exit 1
          fi
          case "${TOKEN_ID}" in
            ak-*) ;;
            *)
              echo "MODAL_TOKEN_ID must be the token id starting with ak- (got length ${#TOKEN_ID})"
              exit 1
              ;;
          esac
          case "${TOKEN_SECRET}" in
            as-*) ;;
            ak-*)
              echo "MODAL_API_TOKEN looks like a token id (ak-...), not the secret (as-...)."
              echo "Set MODAL_TOKEN_ID=ak-... and MODAL_API_TOKEN=as-... from Modal Settings → API Tokens."
              exit 1
              ;;
            *)
              echo "MODAL_API_TOKEN must be the token secret starting with as- (got length ${#TOKEN_SECRET})"
              exit 1
              ;;
          esac
          {
            echo "MODAL_TOKEN_ID=${TOKEN_ID}"
            echo "MODAL_TOKEN_SECRET=${TOKEN_SECRET}"
          } >> "$GITHUB_ENV"
          echo "Modal credentials present (id length ${#TOKEN_ID}, secret length ${#TOKEN_SECRET})"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.cfg.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Run GPU tests on Modal H100
        run: |
          modal run .github/scripts/modal_gpu_ci.py \
            --mlip-extra "${{ matrix.mlip_extra }}" \
            --marker "${{ steps.cfg.outputs.marker }}"
