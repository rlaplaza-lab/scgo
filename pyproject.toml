[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scgo"
dynamic = ["version"]
description = "Global optimization of atomic clusters using ASE with Basin Hopping and Genetic Algorithms, MLIP calculators (MACE, UMA, UPET), surface/adsorbate workflows, and NEB transition-state search."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "R. Laplaza", email = "ruben.laplaza@iiq.csic.es" },
]
keywords = ["computational-chemistry", "structure-optimization", "atomic-clusters", "basin-hopping", "genetic-algorithm", "ase", "mace", "uma", "upet", "fairchem", "metatomic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "ase>=3.22.0",
    "ase-ga>=0.1.0",
    "numpy>=2.2,<2.5",
    "scipy>=1.14,<3",
    "tqdm>=4.60.0",
]

[project.urls]
Homepage = "https://github.com/rlaplaza-lab/scgo"
Documentation = "https://scgo.readthedocs.io/"
Repository = "https://github.com/rlaplaza-lab/scgo"
Issues = "https://github.com/rlaplaza-lab/scgo/issues"

[project.optional-dependencies]
# Install exactly one of [mace], [uma], or [upet] for MLIPs; they use incompatible stacks.
mace = [
    "e3nn==0.4.4",
    "mace-torch==0.3.16",
    "nvalchemi-toolkit-ops==0.3.1",
    "nvidia-nccl-cu12>=2.28",
    "torch>=2.12.0,<2.13",
    "torch-sim-atomistic[mace]==0.6.0",
]
uma = [
    "fairchem-core>=2.19.0",
    "torch-sim-atomistic[fairchem]==0.6.0",
]
upet = [
    "upet>=0.2.6",
    "metatomic-torchsim>=0.1.3",
    # vesin 0.6.0 required at runtime for NeighborList(skin=...).
    # Install after this extra: pip install 'vesin==0.6.0' --force-reinstall --no-deps
    # See docs/source/installation.rst for details.
    "torch-sim-atomistic==0.6.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=4.0.0",
    "psutil>=7.0.0",
    "ruff==0.14.0",
    "mypy>=1.10",
    "pre-commit>=3.0.0",
]


[tool.setuptools]
packages = { find = {} }

[tool.setuptools.dynamic]
version = { attr = "scgo._version.__version__" }

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    "*.yaml",
    "*.yml",
    "Makefile",
    "docs/*",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "SIM", # simplify
    "PERF", # performance
    "PIE", # flake8-pie
    "D",  # pydocstyle: docstring conventions
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "D107",  # __init__ docstrings are omitted where the class docstring covers params
]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"scgo/__init__.py" = ["E402"]  # set PYTORCH_CUDA_ALLOC_CONF before torch/torch_sim and scgo imports
"scgo/calculators/mace_helpers.py" = ["E402"]  # patch torch.load before mace/e3nn import
"tests/**/*" = ["D"]
"scgo/ase_ga_patches/*" = ["E402"]
"scgo/_version.py" = ["D100"]
"benchmark/*" = ["E501", "T201", "SIM108", "C408", "PERF401", "D"]  # scripts: prints, dict builders, nested grid loops
".github/scripts/**/*" = ["D"]  # CI helper scripts, not public API
"examples/**/*" = ["D"]  # runnable example scripts, not public API

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
# Known untyped third-party dependencies: keep their import errors quiet while
# still catching genuine import-not-found for packages that should be present.
module = [
    "ase_ga.*",
    "fairchem.*",
    "tqdm.*",
    "upet.*",
]
ignore_missing_imports = true