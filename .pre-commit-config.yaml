repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-orphan-pyc
        name: check orphan test bytecode
        entry: python scripts/check_orphan_pyc.py
        language: system
        pass_filenames: false
        always_run: true
